before:
  hooks:
    - make deps
builds:
  - main: .
    binary: rllmx
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
    flags:
      - -trimpath
      - -a
      - -tags=nomsgpack
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - 386
      - amd64
      - arm64
archives:
- replacements:
    darwin: macos
    linux: linux
    windows: windows
    386: 32-bit
    amd64: 64-bit
    arm64: arm-64-bit
  format: zip
  files:
    - LICENSE
    - README.md
    - .env.example
checksum:
  name_template: "checksums.txt"
snapshot:
  name_template: "{{ .Version }}"
changelog:
  filters:
    exclude:
      - "^docs:"
      - "^test:"

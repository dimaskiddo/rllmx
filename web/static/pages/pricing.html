<section x-data="pricingPage">
  <div class="rl-page-head">
    <h1 class="rl-page-title" x-t="pricing.title"></h1>
  </div>
  <p class="text-secondary" x-t="pricing.hint"></p>
  <p class="rl-error" x-show="error" x-text="error"></p>

  <div class="rl-grid">
    <div class="rl-stat"><span class="text-secondary" x-t="pricing.models"></span><span class="rl-stat-value" x-text="modelCount()"></span></div>
    <div class="rl-stat"><span class="text-secondary" x-t="pricing.providers"></span><span class="rl-stat-value" x-text="providerCount()"></span></div>
    <div class="rl-stat"><span class="text-secondary" x-t="pricing.edited"></span><span class="rl-stat-value" x-text="dirtyCount()"></span></div>
  </div>

  <div class="rl-toolbar">
    <input class="form-control form-control-sm" type="search" x-bind:placeholder="label('pricing.search')" x-bind:aria-label="label('pricing.search')" x-bind:value="search" x-on:input.debounce.250ms="setSearch($event)">
    <button type="button" class="btn btn-sm btn-primary" x-bind:disabled="busy === true || dirtyCount() === 0" x-on:click="save()" x-t="common.save"></button>
    <button type="button" class="btn btn-sm btn-outline-danger" x-bind:disabled="busy === true" x-on:click="reset()"><span class="rl-icon" x-icon="trash"></span><span x-t="pricing.reset"></span></button>
  </div>

  <p class="text-secondary" x-show="loading" x-t="common.loading"></p>
  <p class="rl-hint" x-t="pricing.rules"></p>

  <template x-for="provider in providers()" x-bind:key="provider.name">
    <section class="card">
      <div class="card-header rl-card-head">
        <h2 class="rl-card-title" x-text="provider.name"></h2>
      </div>
      <div class="card-body">
        <div class="rl-table-wrap">
          <table class="table table-sm">
            <caption class="visually-hidden" x-text="provider.name"></caption>
            <thead>
              <tr>
                <th scope="col" x-t="pricing.model"></th>
                <template x-for="field in fields()" x-bind:key="field">
                  <th scope="col" class="text-end" x-text="fieldName(field)"></th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template x-for="row in provider.models" x-bind:key="row.model">
                <tr>
                  <td x-text="row.model"></td>
                  <template x-for="field in fields()" x-bind:key="field">
                    <td class="text-end">
                      <input class="form-control form-control-sm text-end" type="number" min="0" step="0.01" x-bind:value="row[field]" x-bind:aria-label="row.model + ' ' + fieldName(field)" x-on:change="setPrice(provider.name, row.model, field, $event)">
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </template>
</section>

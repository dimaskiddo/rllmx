<section x-data="consoleLogPage">
  <div class="rl-page-head">
    <h1 class="rl-page-title" x-t="console.title"></h1>
  </div>
  <p class="text-secondary" x-t="console.hint"></p>

  <section class="card">
    <div class="card-header rl-card-head">
      <h2 class="rl-card-title" x-t="console.lines"></h2>
      <div class="rl-inline">
        <input class="form-control form-control-sm" type="search" x-bind:placeholder="label('console.filter')" x-bind:aria-label="label('console.filter')" x-bind:value="filter" x-on:input="setFilter($event)">
        <button type="button" class="btn btn-sm btn-ghost-danger" x-on:click="clearLogs()" x-tip="console.clear"><span class="rl-icon" x-icon="trash"></span><span class="visually-hidden" x-t="console.clear"></span></button>
      </div>
    </div>
    <div class="card-body">
      <p class="rl-hint" x-show="visible().length === 0" x-t="console.empty"></p>
      <div class="rl-log" x-ref="panel" role="log" aria-live="polite" x-bind:aria-label="label('console.title')">
        <template x-for="row in visible()" x-bind:key="row.seq">
          <div class="rl-log-line" x-bind:data-level="row.level" x-text="lineText(row)"></div>
        </template>
      </div>
    </div>
  </section>
</section>

<section x-data="skillsPage">
  <div class="rl-page-head">
    <h1 class="rl-page-title" x-t="skills.title"></h1>
  </div>
  <p class="text-secondary" x-t="skills.hint"></p>
  <p class="rl-error" x-show="error" x-text="error"></p>

  <p class="rl-warning" x-show="problems.length > 0"><span class="rl-icon" x-icon="triangle-exclamation-point"></span><span x-t="skills.problems"></span></p>
  <ul class="rl-chips" x-show="problems.length > 0">
    <template x-for="problem in problems" x-bind:key="problem">
      <li class="rl-chip"><span x-text="problem"></span></li>
    </template>
  </ul>

  <div class="rl-toolbar">
    <input class="form-control form-control-sm" type="search" x-bind:placeholder="label('skills.search')" x-bind:aria-label="label('skills.search')" x-bind:value="search" x-on:input="setSearch($event)">
    <select class="form-select form-select-sm" x-bind:aria-label="label('skills.hookFilter')" x-bind:value="hook" x-on:change="setHookFilter($event)">
      <template x-for="value in hooks()" x-bind:key="value">
        <option x-bind:value="value" x-text="value === 'all' ? label('skills.allHooks') : hookName(value)"></option>
      </template>
    </select>
    <button type="button" class="btn btn-sm btn-primary" x-on:click="openCreate()"><span class="rl-icon" x-icon="wand-sparkles"></span><span x-t="skills.create"></span></button>
  </div>

  <p class="text-secondary" x-show="loading" x-t="common.loading"></p>
  <p class="rl-hint" x-show="!loading && visible().length === 0" x-t="skills.empty"></p>

  <section class="card" x-show="!loading && visible().length > 0">
    <div class="card-body">
      <ul class="rl-list">
        <template x-for="skill in visible()" x-bind:key="skill.id">
          <li class="rl-list-row">
            <div class="rl-list-main">
              <div class="rl-list-title">
                <span x-text="skill.name"></span>
                <span class="badge" x-text="hookName(skill.hook)"></span>
                <span class="badge" x-show="skill.version" x-text="skill.version"></span>
                <span class="badge" x-text="source(skill)"></span>
              </div>
              <p class="text-secondary" x-text="skill.description"></p>
              <div class="rl-inline">
                <label class="form-check form-switch rl-switch">
                  <input class="form-check-input" type="checkbox" role="switch" x-bind:aria-label="label('skills.enabled') + ' ' + skill.name" x-bind:checked="skill.enabled === true" x-on:change="toggle(skill, $event)">
                  <span class="form-check-label" x-t="skills.enabled"></span>
                </label>
                <select class="form-select form-select-sm" x-show="skill.routable === true" x-bind:aria-label="label('skills.routingMode')" x-bind:value="skill.mode" x-on:change="setMode(skill, $event)">
                  <option value="smart" x-t="skills.smart"></option>
                  <option value="always" x-t="skills.always"></option>
                </select>
              </div>
              <div class="rl-inline" x-show="skill.enabled === true && skill.config_schema && skill.config_schema.length > 0">
                <template x-for="field in skill.config_schema" x-bind:key="field.key">
                  <div>
                    <template x-if="field.type === 'toggle'">
                      <label class="form-check form-switch rl-switch">
                        <input class="form-check-input" type="checkbox" role="switch" x-bind:checked="fieldValue(skill, field) === true" x-on:change="setConfig(skill, field, $event)">
                        <span class="form-check-label" x-text="field.label || field.key"></span>
                      </label>
                    </template>
                    <template x-if="field.type !== 'toggle'">
                      <div>
                        <label class="form-label" x-bind:for="skill.id + '-' + field.key" x-text="field.label || field.key"></label>
                        <template x-if="field.type === 'enum'">
                          <select class="form-select form-select-sm" x-bind:id="skill.id + '-' + field.key" x-on:change="setOption(skill, field, $event.target.value)">
                            <template x-for="option in field.options" x-bind:key="option.value">
                              <option x-bind:value="option.value" x-bind:selected="option.value === fieldValue(skill, field)" x-text="option.label || option.value"></option>
                            </template>
                          </select>
                        </template>
                        <template x-if="field.type === 'slider'">
                          <input class="form-range" type="range" x-bind:id="skill.id + '-' + field.key" x-bind:min="field.min || 1" x-bind:max="field.max || 10" step="1" x-bind:value="fieldValue(skill, field)" x-on:change="setConfig(skill, field, $event)">
                        </template>
                        <template x-if="field.type === 'number'">
                          <input class="form-control form-control-sm" type="number" x-bind:id="skill.id + '-' + field.key" x-bind:min="field.min || 1" x-bind:max="field.max || 10" x-bind:value="fieldValue(skill, field)" x-on:change="setConfig(skill, field, $event)">
                        </template>
                        <template x-if="field.type !== 'enum' && field.type !== 'slider' && field.type !== 'number'">
                          <input class="form-control form-control-sm" type="text" x-bind:id="skill.id + '-' + field.key" x-bind:value="fieldValue(skill, field)" x-on:change="setConfig(skill, field, $event)">
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
            <div class="rl-list-actions">
              <button type="button" class="btn btn-sm btn-ghost" x-show="skill.editable === true" x-on:click="openEdit(skill)" x-tip="common.edit"><span class="rl-icon" x-icon="pencil"></span><span class="visually-hidden" x-t="common.edit"></span></button>
              <button type="button" class="btn btn-sm btn-ghost-danger" x-show="skill.editable === true" x-on:click="removeSkill(skill)" x-tip="common.delete"><span class="rl-icon" x-icon="trash"></span><span class="visually-hidden" x-t="common.delete"></span></button>
            </div>
          </li>
        </template>
      </ul>
    </div>
  </section>

  <section class="card">
    <div class="card-header rl-card-head">
      <h2 class="rl-card-title" x-t="skills.syncTitle"></h2>
    </div>
    <div class="card-body">
      <p class="rl-hint" x-t="skills.syncHint"></p>
      <label class="form-label" for="sync-source" x-t="skills.syncSource"></label>
      <input class="form-control" id="sync-source" type="url" maxlength="2048" x-bind:value="sync.source" x-on:input="setSync('source', $event)">
      <label class="form-label" for="sync-tag" x-t="skills.syncTag"></label>
      <input class="form-control" id="sync-tag" type="text" maxlength="128" x-bind:value="sync.tag" x-on:input="setSync('tag', $event)">
      <div class="form-check form-switch rl-switch">
        <input class="form-check-input" type="checkbox" id="sync-force" role="switch" x-bind:checked="sync.force" x-on:change="setSyncForce($event)">
        <label class="form-check-label" for="sync-force" x-t="skills.syncForce"></label>
      </div>
      <p class="rl-error" x-show="sync.error" x-text="sync.error"></p>
      <p class="rl-hint" x-show="sync.result" x-text="sync.result"></p>
      <div class="rl-actions">
        <button type="button" class="btn btn-primary" x-bind:disabled="sync.busy === true" x-on:click="runSync()" x-t="skills.syncRun"></button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-header rl-card-head">
      <h2 class="rl-card-title" x-t="skills.planTitle"></h2>
    </div>
    <div class="card-body">
      <p class="rl-hint" x-t="skills.planHint"></p>
      <div class="form-check form-switch rl-switch">
        <input class="form-check-input" type="checkbox" id="plan-on" role="switch" x-bind:checked="plan.autoPlanEnabled" x-on:change="setPlanBool('autoPlanEnabled', $event)">
        <label class="form-check-label" for="plan-on" x-t="skills.planOn"></label>
      </div>
      <div x-show="plan.autoPlanEnabled === true">
        <label class="form-label" for="plan-mode" x-t="skills.planMode"></label>
        <select class="form-select" id="plan-mode" x-bind:value="plan.autoPlanMode" x-on:change="setPlanField('autoPlanMode', $event)">
          <option value="auto" x-t="skills.planAuto"></option>
          <option value="manual" x-t="skills.planManual"></option>
        </select>
        <div x-show="plan.autoPlanMode === 'manual'">
          <label class="form-label" for="plan-combo" x-t="skills.planCombo"></label>
          <select class="form-select" id="plan-combo" x-bind:value="plan.autoPlanComboId" x-on:change="setPlanField('autoPlanComboId', $event)">
            <option value="" x-t="skills.planComboDefault"></option>
            <template x-for="combo in combos" x-bind:key="combo.id">
              <option x-bind:value="combo.name" x-text="combo.name"></option>
            </template>
          </select>
          <label class="form-label" for="plan-code-combo" x-t="skills.codeCombo"></label>
          <select class="form-select" id="plan-code-combo" x-bind:value="plan.autoCodeComboId" x-on:change="setPlanField('autoCodeComboId', $event)">
            <option value="" x-t="skills.planComboDefault"></option>
            <template x-for="combo in combos" x-bind:key="combo.id">
              <option x-bind:value="combo.name" x-text="combo.name"></option>
            </template>
          </select>
        </div>
        <label class="form-label" for="plan-threshold" x-t="skills.planThreshold"></label>
        <input class="form-range" id="plan-threshold" type="range" min="1" max="10" step="1" x-bind:value="plan.autoPlanComplexityThreshold" x-on:change="setPlanField('autoPlanComplexityThreshold', $event)">
        <p class="rl-hint" x-t="skills.planThresholdHint"></p>
        <label class="form-label" for="plan-tokens" x-t="skills.planMaxTokens"></label>
        <input class="form-control" id="plan-tokens" type="number" min="200" max="4000" step="100" x-bind:value="plan.autoPlanMaxTokens" x-on:change="setPlanField('autoPlanMaxTokens', $event)">
        <label class="form-label" for="plan-timeout" x-t="skills.planTimeout"></label>
        <input class="form-control" id="plan-timeout" type="number" min="1000" max="60000" step="1000" x-bind:value="plan.autoPlanTimeoutMs" x-on:change="setPlanField('autoPlanTimeoutMs', $event)">
        <div class="form-check form-switch rl-switch">
          <input class="form-check-input" type="checkbox" id="plan-smart" role="switch" x-bind:checked="plan.autoPlanSmartClassify" x-on:change="setPlanBool('autoPlanSmartClassify', $event)">
          <label class="form-check-label" for="plan-smart" x-t="skills.planSmart"></label>
        </div>
        <div class="form-check form-switch rl-switch">
          <input class="form-check-input" type="checkbox" id="plan-show" role="switch" x-bind:checked="plan.autoPlanShowInResponse" x-on:change="setPlanBool('autoPlanShowInResponse', $event)">
          <label class="form-check-label" for="plan-show" x-t="skills.planShow"></label>
        </div>
      </div>
    </div>
  </section>

  <dialog class="rl-dialog" x-ref="studio" aria-labelledby="skills-studio-title">
    <form method="dialog" x-on:submit.prevent="saveStudio()">
      <h2 id="skills-studio-title" x-t="skills.studioTitle"></h2>
      <div x-show="studio">
        <label class="form-label" for="studio-name" x-t="skills.studioName"></label>
        <input class="form-control" id="studio-name" type="text" maxlength="100" x-bind:value="studio ? studio.name : ''" x-on:input="setStudioField('name', $event)">
        <label class="form-label" for="studio-id" x-t="skills.studioID"></label>
        <input class="form-control" id="studio-id" type="text" maxlength="64" x-bind:value="studio ? studio.id : ''" x-bind:disabled="studio && studio.mode === 'edit'" x-on:input="setStudioID($event)">
        <label class="form-label" for="studio-desc" x-t="skills.studioDescription"></label>
        <input class="form-control" id="studio-desc" type="text" maxlength="256" x-bind:value="studio ? studio.description : ''" x-on:input="setStudioField('description', $event)">

        <h3 class="rl-card-title" x-t="skills.studioHook"></h3>
        <ul class="rl-chips">
          <template x-for="value in studioHooks()" x-bind:key="value">
            <li class="rl-chip">
              <button type="button" class="btn btn-sm" x-bind:aria-pressed="studio && studio.hook === value ? 'true' : 'false'" x-on:click="setHook(value)" x-text="hookName(value)"></button>
            </li>
          </template>
        </ul>

        <div x-show="ruleHook() === 'system-prompt'">
          <label class="form-label" for="studio-prompt" x-t="skills.studioPrompt"></label>
          <textarea class="form-control" id="studio-prompt" rows="5" x-bind:value="studio ? studio.prompt : ''" x-on:input="setStudioField('prompt', $event)"></textarea>
        </div>

        <div x-show="ruleHook() !== 'system-prompt'">
          <h3 class="rl-card-title" x-t="skills.studioRules"></h3>
          <p class="text-secondary" x-show="studio && studio.rules.length === 0" x-t="skills.studioNoRules"></p>
          <template x-for="(rule, index) in studioRules()" x-bind:key="index">
            <div class="rl-inline">
              <input class="form-control form-control-sm" type="text" x-bind:placeholder="label('skills.ruleModel')" x-bind:aria-label="label('skills.ruleModel')" x-bind:value="rule.modelRegex" x-on:input="setRule(index, 'modelRegex', $event)">
              <input class="form-control form-control-sm" type="text" x-bind:placeholder="label('skills.ruleMessage')" x-bind:aria-label="label('skills.ruleMessage')" x-bind:value="rule.messageRegex" x-on:input="setRule(index, 'messageRegex', $event)">
              <input class="form-control form-control-sm" type="text" x-bind:placeholder="label('skills.ruleInject')" x-bind:aria-label="label('skills.ruleInject')" x-bind:value="rule.injectPrompt" x-on:input="setRule(index, 'injectPrompt', $event)">
              <input class="form-control form-control-sm" type="text" x-bind:placeholder="label('skills.ruleReroute')" x-bind:aria-label="label('skills.ruleReroute')" x-bind:value="rule.rerouteModel" x-on:input="setRule(index, 'rerouteModel', $event)">
              <button type="button" class="btn btn-sm btn-ghost-danger" x-on:click="removeRule(index)" x-tip="common.remove"><span class="rl-icon" x-icon="x"></span><span class="visually-hidden" x-t="common.remove"></span></button>
            </div>
          </template>
          <button type="button" class="btn btn-sm" x-on:click="addRule()"><span class="rl-icon" x-icon="plus"></span><span x-t="skills.addRule"></span></button>
        </div>

        <p class="rl-error" x-show="studio && studio.error" x-text="studio ? studio.error : ''"></p>
        <div class="rl-dialog-actions">
          <button type="button" class="btn" x-on:click="closeStudio()" x-t="common.cancel"></button>
          <button type="submit" class="btn btn-primary" x-bind:disabled="!studio || studio.busy === true" x-t="common.save"></button>
        </div>
      </div>
    </form>
  </dialog>
</section>
